<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Admin — Sign in — Top Crop Tanzania</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/mobile-styles.css" />
<style>
  :root {
    --bg: #FAFAF7;
    --bg-warm: #F4F2EC;
    --ink: #161614;
    --ink-2: #3A3A36;
    --ink-3: #6A6A64;
    --line: #E4E1D7;
    --line-strong: #C9C5B6;
    --leaf: oklch(0.46 0.07 145);
    --banana: oklch(0.86 0.14 92);
    --error: oklch(0.55 0.19 27);
    --serif: "Instrument Serif", "Times New Roman", serif;
    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: var(--bg);
  }
  body {
    font-family: var(--sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-size: 16px; line-height: 1.55; letter-spacing: -0.005em;
  }
  ::selection { background: var(--ink); color: var(--bg); }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .serif { font-family: var(--serif); font-weight: 400; }
  .mono  { font-family: var(--mono); }

  /* Top hairline + wordmark */
  .topbar {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 22px 48px;
    border-bottom: 1px solid var(--line);
    background: var(--bg);
    z-index: 10;
  }
  .wordmark { font-family: var(--serif); font-style: italic; font-size: 22px; }
  .wordmark sup {
    font-family: var(--mono); font-size: 9px; letter-spacing: .2em;
    margin-left: 6px; vertical-align: super;
  }
  .topbar .right {
    font-family: var(--mono); font-size: 11px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-3);
  }

  /* Stage */
  .stage {
    min-height: 100vh;
    display: grid; place-items: center;
    padding: 120px 24px 80px;
  }
  .card {
    width: 100%;
    max-width: 460px;
    background: var(--bg);
  }

  .eyebrow {
    font-family: var(--mono); font-size: 11px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-3);
    margin-bottom: 18px;
  }
  .title {
    font-family: var(--serif); font-style: italic; font-weight: 400;
    font-size: clamp(40px, 5vw, 64px);
    line-height: 1; letter-spacing: -0.01em;
    margin: 0 0 16px;
  }
  .subtitle {
    font-size: 16px; line-height: 1.55; color: var(--ink-2);
    margin: 0 0 48px;
    max-width: 38ch;
  }

  form { display: flex; flex-direction: column; gap: 32px; }

  .field { display: flex; flex-direction: column; }
  .field label {
    font-family: var(--mono); font-size: 10px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-3);
    margin-bottom: 10px;
  }
  .field .row {
    display: flex; align-items: center;
    border-bottom: 1px solid var(--line-strong);
    transition: border-color .25s ease;
  }
  .field .row:focus-within { border-bottom-color: var(--ink); }
  .field input {
    flex: 1; min-width: 0;
    border: none; background: transparent; outline: none;
    font-family: var(--sans); font-size: 18px; color: var(--ink);
    padding: 14px 0;
    caret-color: var(--ink);
  }
  .field input::placeholder { color: var(--ink-3); }
  .reveal {
    border: none; background: transparent;
    font-family: var(--mono); font-size: 10px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-3);
    padding: 6px 4px 6px 12px;
    transition: color .2s ease;
  }
  .reveal:hover { color: var(--ink); }

  .options {
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--mono); font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-3);
  }
  .remember {
    display: flex; align-items: center; gap: 10px;
    user-select: none; cursor: pointer;
  }
  .remember input { position: absolute; opacity: 0; pointer-events: none; }
  .remember .box {
    width: 16px; height: 16px;
    border: 1px solid var(--line-strong); background: var(--bg);
    display: grid; place-items: center;
    transition: background .2s ease, border-color .2s ease;
  }
  .remember .box::after {
    content: ""; width: 8px; height: 8px;
    background: var(--ink); transform: scale(0);
    transition: transform .2s ease;
  }
  .remember input:checked + .box { border-color: var(--ink); }
  .remember input:checked + .box::after { transform: scale(1); }
  .remember:hover .box { border-color: var(--ink); }
  .forgot { transition: color .2s ease; }
  .forgot:hover { color: var(--ink); border-bottom: 1px solid currentColor; }

  .submit {
    margin-top: 8px;
    padding: 18px 24px;
    background: var(--ink); color: var(--bg);
    border: 1px solid var(--ink);
    font-family: var(--mono); font-size: 12px; letter-spacing: .2em;
    text-transform: uppercase;
    transition: background .25s ease, color .25s ease;
  }
  .submit:hover { background: transparent; color: var(--ink); }
  .submit:disabled { opacity: .5; cursor: not-allowed; }

  .error {
    display: none;
    margin: 0 0 24px;
    padding: 14px 18px;
    border-left: 2px solid var(--error);
    background: color-mix(in srgb, var(--error) 8%, transparent);
    font-family: var(--mono); font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--error);
  }
  .error.show { display: block; }

  /* Bottom helper */
  .help {
    margin-top: 48px;
    padding-top: 24px;
    border-top: 1px solid var(--line);
    font-family: var(--mono); font-size: 11px; letter-spacing: .12em;
    text-transform: uppercase; color: var(--ink-3);
    text-align: center;
  }
  .help a { color: var(--ink); border-bottom: 1px solid currentColor; padding-bottom: 1px; }

  /* Footer marker */
  .legal {
    position: fixed; bottom: 0; left: 0; right: 0;
    padding: 18px 48px;
    display: flex; justify-content: space-between;
    font-family: var(--mono); font-size: 10px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-3);
    border-top: 1px solid var(--line);
    background: var(--bg);
  }

  @media (max-width: 720px) {
    .topbar { padding: 16px 20px; }
    .legal { padding: 14px 20px; flex-direction: column; gap: 4px; }
    .stage { padding: 96px 20px 96px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <a class="wordmark" href="Top Crop.html">Top Crop<sup>TZ</sup></a>
  <span class="right">Admin Console</span>
</div>

<main class="stage">
  <section class="card">
    <div class="eyebrow">Restricted Area</div>
    <h1 class="title">Sign in.</h1>
    <p class="subtitle">
      Manage content for the Top Crop website. Sign in with your team
      credentials — sessions expire after 24 hours of inactivity.
    </p>

    <div class="error" id="err">Invalid credentials. Please try again.</div>

    <form id="loginForm" autocomplete="on" novalidate>
      <div class="field">
        <label for="login">01 — Login</label>
        <div class="row">
          <input id="login" name="login" type="text" autocomplete="username"
                 placeholder="you@topcrop.tz" required/>
        </div>
      </div>

      <div class="field">
        <label for="password">02 — Password</label>
        <div class="row">
          <input id="password" name="password" type="password"
                 autocomplete="current-password" placeholder="••••••••••" required/>
          <button type="button" class="reveal" id="revealBtn"
                  aria-label="Show password">Show</button>
        </div>
      </div>

      <div class="options">
        <label class="remember">
          <input type="checkbox" id="remember" name="remember"/>
          <span class="box"></span>
          <span>Remember me</span>
        </label>
        <a href="#" class="forgot">Forgot password?</a>
      </div>

      <button class="submit" type="submit" id="submitBtn">Sign in →</button>
    </form>

    <div class="help">
      Need access? <a href="mailto:it@topcrop.tz">Contact IT</a>
    </div>
  </section>
</main>

<div class="legal">
  <span>Top Crop Tanzania · Admin Console</span>
  <span>v 1.0</span>
</div>

<script>
  // Clear placeholders on focus, restore them on blur if still empty
  document.querySelectorAll("#loginForm input[placeholder]").forEach((el) => {
    const original = el.getAttribute("placeholder");
    el.addEventListener("focus", () => el.setAttribute("placeholder", ""));
    el.addEventListener("blur", () => {
      if (!el.value) el.setAttribute("placeholder", original);
    });
  });

  // Reveal password
  const pw = document.getElementById("password");
  const reveal = document.getElementById("revealBtn");
  reveal.addEventListener("click", () => {
    const showing = pw.type === "text";
    pw.type = showing ? "password" : "text";
    reveal.textContent = showing ? "Show" : "Hide";
  });

  // Submit handling — prototype only. Hooks up to backend later.
  const form = document.getElementById("loginForm");
  const err = document.getElementById("err");
  const submitBtn = document.getElementById("submitBtn");

  function showError(msg) {
    err.textContent = msg;
    err.classList.add("show");
    submitBtn.disabled = false;
    submitBtn.textContent = "Sign in →";
  }

  function nextUrl() {
    const params = new URLSearchParams(location.search);
    const n = params.get("next");
    // Only allow same-origin paths.
    if (n && n.startsWith("/") && !n.startsWith("//")) return n;
    return "/admin";
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.classList.remove("show");
    const login = document.getElementById("login").value.trim();
    const password = pw.value;
    if (!login || !password) {
      showError("Please enter both login and password.");
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in…";
    try {
      const r = await fetch("/api/auth/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({ email: login, password: password }),
      });
      if (r.ok) {
        window.location.href = nextUrl();
        return;
      }
      const body = await r.json().catch(() => ({}));
      if (body.error === "admin_not_configured") {
        showError("Admin not configured — set ADMIN_PASSWORD_HASH in .env");
      } else if (body.error === "invalid_credentials") {
        showError("Invalid credentials. Please try again.");
      } else {
        showError("Sign-in failed. Please try again.");
      }
    } catch (_e) {
      showError("Network error. Please try again.");
    }
  });
</script>
</body>
</html>
